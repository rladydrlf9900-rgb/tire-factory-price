<title>타이어공장도가격 — 매장 전용 공장도가 조회</title>
<style>
  :root{
    --bg:#f4f7fb; --panel:#ffffff; --panel-2:#fafcff;
    --ink:#101823; --ink-2:#4a5766; --ink-3:#7d8b9b;
    --line:#dce4ef; --line-2:#eaf0f8;
    --brand:#1552d0; --brand-ink:#0f3c9c; --brand-soft:#e9f0fe;
    --brand-line:#bed0f3; --surface-head:#e4ecfb;
    --price:#d8380f; --price-soft:#fdeee9;
    --ok:#0b8f52; --ok-soft:#e4f5ec;
    --warn:#a86400; --warn-soft:#fcf1dc;
    --shadow:0 1px 2px rgba(16,24,35,.06), 0 6px 18px -10px rgba(16,24,35,.22);
    --shadow-lg:0 2px 6px rgba(16,24,35,.08), 0 28px 56px -24px rgba(16,24,35,.34);
    --kr:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    --r:10px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0c1219; --panel:#131c26; --panel-2:#17222e;
      --ink:#eaf1f8; --ink-2:#a5b4c3; --ink-3:#768696;
      --line:#243141; --line-2:#1b2632;
      --brand:#79a4ff; --brand-ink:#a6c4ff; --brand-soft:#152340;
    --brand-line:#31456b; --surface-head:#1b2942;
      --price:#ff8259; --price-soft:#2d1a14;
      --ok:#42c98a; --ok-soft:#0f2820;
      --warn:#e5b45c; --warn-soft:#2c2312;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px -10px rgba(0,0,0,.7);
      --shadow-lg:0 2px 6px rgba(0,0,0,.55), 0 28px 56px -24px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c1219; --panel:#131c26; --panel-2:#17222e;
    --ink:#eaf1f8; --ink-2:#a5b4c3; --ink-3:#768696;
    --line:#243141; --line-2:#1b2632;
    --brand:#79a4ff; --brand-ink:#a6c4ff; --brand-soft:#152340;
    --brand-line:#31456b; --surface-head:#1b2942;
    --price:#ff8259; --price-soft:#2d1a14;
    --ok:#42c98a; --ok-soft:#0f2820;
    --warn:#e5b45c; --warn-soft:#2c2312;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px -10px rgba(0,0,0,.7);
    --shadow-lg:0 2px 6px rgba(0,0,0,.55), 0 28px 56px -24px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--kr); font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased}
  a{color:inherit; text-decoration:none}
  button,input,select,textarea{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:6px}
  .num{font-variant-numeric:tabular-nums}
  [hidden]{display:none !important}

  /* ============ 공통 컨트롤 ============ */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid transparent; border-radius:var(--r); padding:9px 15px; font-weight:700; font-size:13.5px; cursor:pointer; transition:.14s; white-space:nowrap}
  .btn-pri{background:var(--brand); color:#fff}
  .btn-pri:hover{background:var(--brand-ink)}
  .btn-out{background:var(--panel); border-color:var(--line); color:var(--ink)}
  .btn-out:hover{border-color:var(--brand); color:var(--brand)}
  .btn-quiet{background:transparent; color:var(--ink-2)}
  .btn-quiet:hover{background:var(--brand-soft); color:var(--brand)}
  .btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .inp,.sel{width:100%; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:9px 12px; font-size:14px; transition:.14s}
  .inp:hover,.sel:hover{border-color:var(--ink-3)}
  .inp:focus,.sel:focus{border-color:var(--brand); outline:none; box-shadow:0 0 0 3px var(--brand-soft)}
  .sel{appearance:none; cursor:pointer; padding-right:30px;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 16px) 50%, calc(100% - 11px) 50%;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat}
  label.ck{display:flex; align-items:center; gap:8px; cursor:pointer; padding:5px 2px; font-size:13.5px; border-radius:7px}
  label.ck:hover{color:var(--brand)}
  label.ck input{accent-color:var(--brand); width:15px; height:15px; flex:none}
  label.ck .cnt{margin-left:auto; font-size:11.5px; color:var(--ink-3); font-weight:600}
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:800; padding:3px 8px; border-radius:999px}
  .pill.ok{background:var(--ok-soft); color:var(--ok)}
  .pill.low{background:var(--warn-soft); color:var(--warn)}
  .pill.none{background:var(--line-2); color:var(--ink-3)}
  .pill.new{background:var(--brand-soft); color:var(--brand)}
  .pill.up{background:var(--price-soft); color:var(--price)}

  /* ============ 헤더 ============ */
  .top{position:sticky; top:0; z-index:60; background:var(--panel); border-bottom:1px solid var(--line)}
  .top-in{display:flex; align-items:center; gap:14px; height:58px; padding:0 20px; max-width:1560px; margin:0 auto}
  .logo{display:flex; align-items:center; gap:8px; font-weight:800; font-size:16.5px; letter-spacing:-.045em; white-space:nowrap}
  .logo .mk{width:26px;height:26px;border-radius:8px;background:var(--brand);position:relative;flex:none;border:0;padding:0;appearance:none;cursor:pointer}
  .logo .mk::before{content:"";position:absolute;inset:6px;border-radius:50%;border:2.5px solid #fff}

  /* 관리자 진입 — 로고 마크를 누르면 열린다 */
  .veil{position:fixed; inset:0; z-index:150; background:rgba(16,24,35,.5); display:grid; place-items:center; padding:20px}
  .lock{width:100%; max-width:320px; background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-lg); padding:22px}
  .lock h3{margin:0 0 4px; font-size:17px; font-weight:800; letter-spacing:-.03em}
  .lock p{margin:0 0 16px; font-size:12.5px; color:var(--ink-3)}
  .lock .inp{text-align:center; font-size:19px; font-weight:800; letter-spacing:.3em; padding:12px}
  .lock .row{display:flex; gap:8px; margin-top:12px}
  .lock .row .btn{flex:1}
  .lock .err{margin:10px 0 0; font-size:12.5px; font-weight:700; color:var(--price)}
  .logo b{color:var(--brand)}
  .gsearch{flex:1; max-width:480px; position:relative}
  .gsearch .inp{padding-left:36px; background:var(--bg)}
  .gsearch svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-3)}
  .top-right{margin-left:auto; display:flex; align-items:center; gap:10px}
  .who{font-size:13.5px; font-weight:800; white-space:nowrap}

  /* ============ 조회 레이아웃 ============ */
  .shell{max-width:1560px; margin:0 auto; padding:18px 20px 60px; display:grid; grid-template-columns:250px minmax(0,1fr); gap:18px; align-items:start}
  .rail{position:sticky; top:76px; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
  .fset{padding:15px; border-bottom:1px solid var(--line-2)}
  .fset:last-child{border-bottom:0}
  /* 필터 제목은 브랜드 색 + 왼쪽 막대로 눈에 먼저 들어오게 */
  .fset > h4{margin:0 0 10px; font-size:15px; font-weight:800; letter-spacing:-.03em; color:var(--brand); display:flex; align-items:center; gap:8px}
  .fset > h4::before{content:""; width:4px; height:15px; border-radius:2px; background:var(--brand); flex:none}

  .main{min-width:0; display:flex; flex-direction:column; gap:12px}
  .fchips{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .fchip{display:inline-flex; align-items:center; gap:6px; background:var(--brand-soft); color:var(--brand); border:0; border-radius:999px; padding:5px 9px 5px 11px; font-size:12.5px; font-weight:700; cursor:pointer}
  .fchip::after{content:"✕"; font-size:10px; opacity:.7}
  .fchip:hover{background:var(--brand); color:#fff}

  .tblwrap{background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
  .tscroll{overflow-x:auto}
  table.grid{width:100%; border-collapse:collapse; min-width:950px}
  /* 헤더 줄은 표에서 기준선 역할을 하므로 확실히 구분되게 둔다 */
  table.grid thead th{position:sticky; top:0; z-index:5; background:var(--surface-head); text-align:left; font-size:12.5px; font-weight:800; letter-spacing:-.01em; color:var(--ink); padding:13px 12px; border-top:1px solid var(--brand-line); border-bottom:2px solid var(--brand-line); white-space:nowrap}
  table.grid thead th + th{border-left:1px solid var(--brand-line)}
  table.grid td{padding:9px 12px; border-bottom:1px solid var(--line-2); vertical-align:middle}
  table.grid tbody tr:hover{background:var(--brand-soft)}
  table.grid tbody tr:last-child td{border-bottom:0}
  table.grid th.t-r, table.grid td.t-r{text-align:right}
  table.grid th.t-c, table.grid td.t-c{text-align:center}
  .c-brand{font-weight:700; font-size:13.5px; white-space:nowrap}
  .c-model{font-weight:800; letter-spacing:-.02em}
  .c-name{font-weight:600; color:var(--ink-2); letter-spacing:-.01em; white-space:nowrap}
  .c-spec{font-size:13.5px; font-weight:700; white-space:nowrap}
  .c-spec i{font-style:normal; color:var(--ink-3); font-weight:600; font-size:12px}
  .c-fac{font-size:15.5px; font-weight:700; letter-spacing:-.02em; white-space:nowrap; color:var(--ink-2)}
  .c-fac u{text-decoration:none; font-size:12px; color:var(--ink-3); margin-left:1px}
  /* 할인가 = 공장도가 × (1 − DC율). 이 화면에서 제일 중요한 숫자다 */
  .c-sale{font-size:18px; font-weight:800; letter-spacing:-.035em; color:var(--price); white-space:nowrap}
  .won{font-size:12px; font-weight:700; color:var(--price); margin-left:1px}
  .dcinp{width:66px; text-align:right; padding:6px 22px 6px 8px; border:1px solid var(--line); border-radius:7px; background:var(--panel); font-weight:800; font-size:14px; font-variant-numeric:tabular-nums}
  .dcinp::-webkit-outer-spin-button,.dcinp::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .dcinp{-moz-appearance:textfield}
  .dcinp:hover{border-color:var(--ink-3)}
  .dcinp:focus{border-color:var(--brand); outline:none; box-shadow:0 0 0 3px var(--brand-soft)}
  .dcinp.set{border-color:var(--brand); background:var(--brand-soft); color:var(--brand)}
  .dccell{position:relative; display:inline-block}
  .dccell .pc{position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:12px; font-weight:800; color:var(--ink-3); pointer-events:none}
  .empty{padding:64px 20px; text-align:center; color:var(--ink-3)}
  .empty b{display:block; color:var(--ink); font-size:16px; margin-bottom:6px; font-weight:800}

  .pager{display:flex; align-items:center; justify-content:center; gap:5px; padding:16px}
  .pager button{min-width:33px; height:33px; padding:0 9px; border:1px solid var(--line); background:var(--panel); border-radius:8px; font-size:13px; font-weight:700; color:var(--ink-2); cursor:pointer}
  .pager button:hover:not(:disabled){border-color:var(--brand); color:var(--brand)}
  .pager button.on{background:var(--brand); border-color:var(--brand); color:#fff}
  .pager button:disabled{opacity:.35; cursor:not-allowed}

  /* ============ 관리자 ============ */
  .adm{max-width:1200px; margin:0 auto; padding:26px 20px 60px; display:flex; flex-direction:column; gap:18px}
  .admhead{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap}
  .admhead h2{margin:0; font-size:22px; font-weight:800; letter-spacing:-.04em}
  .admhead p{margin:5px 0 0; font-size:13.5px; color:var(--ink-2); max-width:62ch}
  .admhead .sp{margin-left:auto}

  /* 제조사별 업로드 박스 */
  .bgrid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
  .bcard{background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:15px; display:flex; flex-direction:column; gap:3px; transition:.15s}
  .bcard.over{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft), var(--shadow)}
  .bc-h{display:flex; align-items:center; gap:8px; margin-bottom:2px}
  .bc-h b{font-size:16px; font-weight:800; letter-spacing:-.03em}
  .bc-h .pill{margin-left:auto}
  .bc-file{font-size:12.5px; font-weight:700; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bc-when{font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}
  .bdrop{margin-top:11px; border:1.5px dashed var(--line); border-radius:10px; background:var(--panel-2); padding:13px 10px; text-align:center; cursor:pointer; transition:.14s}
  .bdrop:hover,.bcard.over .bdrop{border-color:var(--brand); background:var(--brand-soft)}
  .bdrop b{display:block; font-size:13.5px; font-weight:800; color:var(--brand)}
  .bdrop span{font-size:11.5px; color:var(--ink-3)}
  .bcard.done{border-color:var(--ok)}
  .bcard.done .bdrop{border-color:var(--ok); background:var(--ok-soft)}
  .bcard.done .bdrop b{color:var(--ok)}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
  .card-h{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line-2); flex-wrap:wrap}
  .card-h h3{margin:0; font-size:15.5px; font-weight:800; letter-spacing:-.03em}
  .card-h p{margin:0; font-size:12.5px; color:var(--ink-3)}
  .card-h .sp{margin-left:auto}
  .card-b{padding:16px}

  table.mini{width:100%; border-collapse:collapse; font-size:13px; min-width:720px}
  table.mini th{text-align:left; font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--ink-3); padding:9px 11px; background:var(--panel-2); border-bottom:1px solid var(--line); white-space:nowrap}
  table.mini td{padding:9px 11px; border-bottom:1px solid var(--line-2); white-space:nowrap}
  table.mini th.t-r,table.mini td.t-r{text-align:right}
  table.mini th.t-c,table.mini td.t-c{text-align:center}
  .toast{position:fixed; right:20px; bottom:20px; z-index:200; background:var(--ink); color:var(--bg); padding:12px 17px; border-radius:11px; font-size:13.5px; font-weight:700; box-shadow:var(--shadow-lg); opacity:0; transform:translateY(10px); transition:.22s; pointer-events:none}
  .toast.show{opacity:1; transform:none}

  .mobcards{display:none; flex-direction:column; gap:10px; padding:12px}
  .mcard{border:1px solid var(--line); border-radius:11px; padding:13px}
  .mcard .r1{display:flex; align-items:center; gap:7px; margin-bottom:2px}
  .mcard .r1 b{font-size:12.5px; color:var(--brand); font-weight:800}
  .mcard h4{margin:0; font-size:14.5px; font-weight:800; letter-spacing:-.02em}
  .mcard .sz{font-size:13px; font-weight:700; color:var(--ink-2); margin-top:3px}
  .mcard .pr{display:flex; align-items:center; gap:10px; margin-top:9px; padding-top:9px; border-top:1px dashed var(--line)}
  .mcard .pr .lb{font-size:11px; font-weight:800; color:var(--ink-3); display:block}

  @media (max-width:1240px){ .bgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:980px){
    .shell{grid-template-columns:1fr}
    .rail{position:static}
    .gsearch{max-width:none}
    .bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:720px){
    .tscroll{display:none}
    .mobcards{display:flex}
    .top-in{gap:10px}
    .logo span.txt{display:none}
    .who{display:none}
  }
  @media (max-width:560px){ .bgrid{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>

<!-- ==================== 조회 ==================== -->
<div id="view-app">
  <header class="top">
    <div class="top-in">
      <span class="logo"><button class="mk" id="mk-admin" aria-label="타이어공장도가격"></button><span class="txt">타이어<b>공장도가격</b></span></span>
      <div class="gsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input class="inp" id="q" type="search" placeholder="제품명 또는 규격 검색 (예: 벤투스, 225/45R18)">
      </div>
    </div>
  </header>

  <div class="shell">
    <aside class="rail">
      <div class="fset">
        <h4>제조사</h4>
        <div id="brandlist"></div>
      </div>

      <div class="fset">
        <h4>계절</h4>
        <div id="seasonlist"></div>
      </div>
    </aside>

    <div class="main">
      <div class="fchips" id="chips" hidden></div>

      <div class="tblwrap">
        <div class="tscroll">
          <table class="grid">
            <thead>
              <tr>
                <th style="width:92px">제조사</th>
                <th>모델</th>
                <th style="width:150px">제품명</th>
                <th style="width:190px">규격</th>
                <th class="t-c" style="width:80px">계절</th>
                <th class="t-r" style="width:130px">공장도가</th>
                <th class="t-c" style="width:96px">DC율</th>
                <th class="t-r" style="width:140px">할인가</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="mobcards" id="mrows"></div>
        <div class="pager" id="pager"></div>
      </div>
    </div>
  </div>
</div>

<!-- ==================== 관리자 ==================== -->
<div id="view-admin" hidden>
  <header class="top">
    <div class="top-in">
      <span class="logo"><span class="mk"></span><span class="txt">타이어<b>공장도가격</b> <span style="font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:.08em">ADMIN</span></span></span>
      <span style="flex:1"></span>
      <div class="top-right">
        <button class="btn btn-out btn-sm" id="btn-logout" data-go="app">조회 화면으로 나가기</button>
      </div>
    </div>
  </header>

  <div class="adm">
    <div class="admhead">
      <div>
        <h2>제조사별 가격표 올리기</h2>
        <p>박스에 파일을 끌어다 놓으면 그 제조사 가격표만 새 파일 내용으로 바뀝니다. 새로 나온 제품이 파일에 들어 있으면 자동으로 추가됩니다.</p>
      </div>
      <span class="sp"></span>
      <button class="btn btn-out" id="btn-tpl">양식 내려받기</button>
    </div>

    <div class="bgrid" id="bgrid"></div>

    <div class="card">
      <div class="card-h"><div><h3>최근 올린 파일</h3><p>잘못 올렸으면 되돌리기를 누르면 이전 가격표로 돌아갑니다.</p></div></div>
      <div style="overflow-x:auto">
        <table class="mini">
          <thead><tr><th style="width:150px">올린 날짜</th><th style="width:110px">제조사</th><th>파일명</th><th class="t-c" style="width:110px">되돌리기</th></tr></thead>

      </div>

</div>

<div class="veil" id="lockveil" hidden>
  <div class="lock">
    <h3>관리자 비밀번호</h3>
    <p>가격표를 올리려면 비밀번호를 입력하세요.</p>
    <input class="inp num" id="lockpw" type="password" inputmode="numeric" maxlength="8" placeholder="••••">
    <p class="err" id="lockerr" hidden>비밀번호가 맞지 않습니다.</p>
    <div class="row">
      <button class="btn btn-out" id="lockno">취소</button>
      <button class="btn btn-pri" id="lockok">들어가기</button>
    </div>
    <p style="margin:14px 0 0; font-size:11.5px; color:var(--ink-3)">시안 확인용 비밀번호 : 1234</p>
  </div>
</div>


<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var $ = function(s, r){ return (r || document).querySelector(s); };
  var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var won = function(n){ return n.toLocaleString("ko-KR"); };

  var toastTimer;
  function toast(msg){
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  /* ---------- 가격표 데이터 (시안용 생성) ---------- */
  /* [제품명, 모델, 계절] — 예: 엔페라(제품명) / AU7(모델) */
  var CATALOG = [
    {b:"한국",     p:[["벤투스","S1 에보3 K127","여름"],["벤투스","프라임4 K135","사계절"],["키너지","GT H436","사계절"],["다이나프로","HP2 RA33","SUV"]], tier:1.00},
    {b:"금호",     p:[["마제스티9","솔루스 TA91","사계절"],["엑스타","PS71","여름"],["크루젠","HP71","SUV"],["솔루스","TA51","사계절"]], tier:0.94},
    {b:"넥센",     p:[["엔페라","슈프림","여름"],["엔페라","AU7","사계절"],["로디안","GTX","SUV"],["엔블루","4시즌","사계절"]], tier:0.89},
    {b:"미쉐린",   p:[["파일럿 스포츠","5","여름"],["프라이머시","4 ST","사계절"],["크로스클라이밋","2","사계절"],["라티튜드","스포츠3","SUV"]], tier:1.46},
    {b:"콘티넨탈", p:[["UltraContact","UC7","사계절"],["PremiumContact","6","여름"],["SportContact","7","여름"],["CrossContact","RX","SUV"]], tier:1.34},
    {b:"브리지스톤",p:[["투란자","T005A","사계절"],["포텐자","S007A","여름"],["알렌자","001","SUV"]], tier:1.30},
    {b:"피렐리",   p:[["P ZERO","PZ4","여름"],["친투라토","P7","사계절"],["스콜피온","베르데","SUV"]], tier:1.38},
    {b:"던롭",     p:[["SP 스포츠맥스","050+","여름"],["그란트렉","PT3","SUV"]], tier:1.12},
    {b:"굿이어",   p:[["이글 F1","아시메트릭6","여름"],["어슈어런스","듀라플러스","사계절"]], tier:1.18},
    {b:"요코하마", p:[["ADVAN Sport","V107","여름"],["BluEarth-GT","AE51","사계절"]], tier:1.15}
  ];
  var SIZES = [
    ["185","65","15","88H"],["195","65","15","91H"],["205","55","16","91V"],["205","60","16","92H"],
    ["215","55","17","94V"],["215","60","17","96H"],["225","45","18","95Y XL"],["225","55","18","98V"],
    ["225","60","17","99V"],["235","45","18","98W XL"],["235","55","18","100V"],["235","60","18","103V"],
    ["245","40","19","98Y XL"],["245","45","18","100Y XL"],["255","35","19","96Y XL"],["255","50","19","107W XL"],
    ["265","60","18","110V"],["275","40","20","106Y XL"],["285","45","22","114W XL"],["295","35","21","107Y XL"]
  ];

  /* 시안 데이터는 볼 때마다 같아야 하므로 고정 시드 난수를 쓴다 */
  var seed = 20260818;
  function rnd(){ seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }

  var DATA = [];
  (function build(){
    var id = 1;
    CATALOG.forEach(function(mk){
      mk.p.forEach(function(pt){
        var picks = pt[2] === "SUV" ? SIZES.slice(8) : SIZES;
        picks.forEach(function(sz){
          if(rnd() > 0.55) return;                       /* 제조사마다 취급 규격이 다르다 */
          var inch = +sz[2], w = +sz[0];
          var base = (inch - 13) * 11800 + (w - 180) * 210 + 46000;
          var fac = Math.round(base * mk.tier * (0.9 + rnd() * 0.24) / 500) * 500;
          DATA.push({
            id: id++, brand: mk.b, name: pt[0], model: pt[1], season: pt[2],
            w: sz[0], h: sz[1], inch: sz[2], li: sz[3],
            size: sz[0] + "/" + sz[1] + "R" + sz[2],
            fac: fac,
            dc: 26 + Math.floor(rnd() * 14),             /* 관리자가 정한 기본 DC율 */
            upd: Math.floor(rnd() * 21),
            live: rnd() > 0.04
          });
        });
      });
    });
  })();

  function updLabel(d){ return d === 0 ? "오늘" : d === 1 ? "어제" : d + "일 전"; }

  /* 할인가 = 공장도가 × (1 − DC율/100) */
  function salePrice(fac, dc){ return Math.round(fac * (100 - dc) / 100); }

  /* ---------- 화면 전환 (실제 구축 시 관리자는 /admin 으로 분리) ---------- */
  function go(view){
    $("#view-app").hidden   = view !== "app";
    $("#view-admin").hidden = view !== "admin";
    window.scrollTo(0, 0);
  }
  $$("[data-go]").forEach(function(b){ b.addEventListener("click", function(){ go(b.dataset.go); }); });
  $("#btn-logout").addEventListener("click", function(){ go("app"); });

  /* ---------- 조회 상태 ---------- */
  var PER = 30;
  var S = { q:"", brands:[], seasons:[], page:1 };
  var DCMAP = {};          /* 행별로 입력한 DC율 */

  /* DC율은 항상 0%에서 시작한다. 검색·필터·페이지가 바뀌면 입력값을 버린다 */
  function dcOf(r){ return DCMAP[r.id] !== undefined ? DCMAP[r.id] : 0; }
  function clearDc(){ DCMAP = {}; }

  (function fillBrands(){
    $("#brandlist").innerHTML = CATALOG.map(function(m){
      return '<label class="ck"><input type="checkbox" value="' + m.b + '">' + m.b + '</label>';
    }).join("");
    $("#seasonlist").innerHTML = ["사계절", "여름", "SUV"].map(function(s){
      return '<label class="ck"><input type="checkbox" value="' + s + '">' + s + '</label>';
    }).join("");
  })();

  function match(r){
    if(!r.live) return false;
    if(S.brands.length && S.brands.indexOf(r.brand) === -1) return false;
    if(S.seasons.length && S.seasons.indexOf(r.season) === -1) return false;
    if(S.q){
      var q = S.q.toLowerCase().replace(/\s/g, "");
      var hay = (r.brand + r.model + r.name + r.size + r.li).toLowerCase().replace(/\s/g, "");
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }

  function render(){
    var list = DATA.filter(match).sort(function(a, b){ return a.fac - b.fac; });
    var pages = Math.max(1, Math.ceil(list.length / PER));
    if(S.page > pages) S.page = pages;
    var slice = list.slice((S.page - 1) * PER, S.page * PER);

    if(!slice.length){
      $("#rows").innerHTML = '<tr><td colspan="8"><div class="empty"><b>조건에 맞는 상품이 없습니다.</b>제조사나 계절을 다시 골라 보세요.</div></td></tr>';
      $("#mrows").innerHTML = '<div class="empty"><b>조건에 맞는 상품이 없습니다.</b></div>';
    } else {
      $("#rows").innerHTML = slice.map(function(r){
        var dc = dcOf(r);
        var mine = DCMAP[r.id] !== undefined && DCMAP[r.id] > 0;
        return '<tr data-id="' + r.id + '">' +
          '<td class="c-brand">' + r.brand + '</td>' +
          '<td class="c-model">' + r.model + '</td>' +
          '<td class="c-name">' + r.name + '</td>' +
          '<td class="c-spec num">' + r.size + ' <i>' + r.li + '</i></td>' +
          '<td class="t-c" style="font-size:12.5px;color:var(--ink-2);font-weight:600">' + r.season + '</td>' +
          '<td class="t-r"><span class="c-fac num">' + won(r.fac) + '</span><u>원</u></td>' +
          '<td class="t-c"><span class="dccell">' +
            '<input class="dcinp num' + (mine ? " set" : "") + '" type="number" min="0" max="95" value="' + (dc ? dc : "") + '" aria-label="DC율">' +
            '<span class="pc">%</span></span></td>' +
          '<td class="t-r"><span class="c-sale num" data-sale>' + won(salePrice(r.fac, dc)) + '</span><span class="won">원</span></td>' +
        '</tr>';
      }).join("");

      $("#mrows").innerHTML = slice.map(function(r){
        var dc = dcOf(r);
        var mine = DCMAP[r.id] !== undefined && DCMAP[r.id] > 0;
        return '<div class="mcard" data-id="' + r.id + '">' +
          '<div class="r1"><b>' + r.brand + '</b><span style="font-size:11.5px;color:var(--ink-3);font-weight:700">' + r.season + '</span></div>' +
          '<h4>' + r.name + ' ' + r.model + '</h4>' +
          '<div class="sz num">' + r.size + ' ' + r.li + '</div>' +
          '<div class="pr">' +
            '<div><span class="lb">공장도가</span><span class="c-fac num">' + won(r.fac) + '원</span></div>' +
            '<div><span class="lb">DC율</span><span class="dccell">' +
              '<input class="dcinp num' + (mine ? " set" : "") + '" type="number" min="0" max="95" value="' + (dc ? dc : "") + '" aria-label="DC율">' +
              '<span class="pc">%</span></span></div>' +
            '<div style="margin-left:auto;text-align:right"><span class="lb">할인가</span>' +
              '<span class="c-sale num" data-sale>' + won(salePrice(r.fac, dc)) + '</span><span class="won">원</span></div>' +
          '</div>' +
        '</div>';
      }).join("");
    }

    var out = ['<button ' + (S.page === 1 ? "disabled" : "") + ' data-p="' + (S.page - 1) + '">‹</button>'];
    var from = Math.max(1, S.page - 2), to = Math.min(pages, Math.max(1, S.page - 2) + 4);
    from = Math.max(1, to - 4);
    if(from > 1) out.push('<button data-p="1">1</button>', '<button disabled>…</button>');
    for(var i = from; i <= to; i++){
      out.push('<button class="' + (i === S.page ? "on" : "") + '" data-p="' + i + '">' + i + '</button>');
    }
    if(to < pages) out.push('<button disabled>…</button>', '<button data-p="' + pages + '">' + pages + '</button>');
    out.push('<button ' + (S.page === pages ? "disabled" : "") + ' data-p="' + (S.page + 1) + '">›</button>');
    $("#pager").innerHTML = out.join("");

    renderChips();
  }

  function renderChips(){
    var c = [];
    S.brands.forEach(function(b){ c.push(["brand:" + b, b]); });
    S.seasons.forEach(function(s){ c.push(["season:" + s, s]); });
    if(S.q) c.push(["q", '"' + S.q + '"']);
    var box = $("#chips");
    box.hidden = !c.length;
    box.innerHTML = c.map(function(x){
      return '<button class="fchip" data-x="' + x[0] + '">' + x[1] + '</button>';
    }).join("") + (c.length > 1 ? '<button class="btn btn-quiet btn-sm" data-x="all">전체 해제</button>' : "");
  }

  /* ---------- DC율 입력 ---------- */
  function applyDcInput(inp){
    var wrapRow = inp.closest("tr") || inp.closest(".mcard");
    if(!wrapRow) return;
    var id = +wrapRow.dataset.id;
    var rec = DATA.filter(function(r){ return r.id === id; })[0];
    if(!rec) return;

    /* 빈 칸이면 할인 없음으로 본다. 0을 미리 넣어두면 50을 칠 때 050이 된다 */
    var raw = String(inp.value).replace(/[^\d]/g, "");
    var v = raw === "" ? 0 : parseInt(raw, 10);
    if(v > 95){ v = 95; inp.value = 95; }
    DCMAP[id] = v;
    inp.classList.toggle("set", v > 0);
    var cell = $("[data-sale]", wrapRow);
    if(cell) cell.textContent = won(salePrice(rec.fac, v));
  }
  ["#rows", "#mrows"].forEach(function(sel){
    $(sel).addEventListener("input", function(e){
      var inp = e.target.closest(".dcinp");
      if(inp) applyDcInput(inp);
    });
  });

  /* ---------- 필터 ---------- */
  $("#brandlist").addEventListener("change", function(e){
    var v = e.target.value;
    if(e.target.checked) S.brands.push(v);
    else S.brands = S.brands.filter(function(x){ return x !== v; });
    S.page = 1; clearDc(); render();
  });
  $("#seasonlist").addEventListener("change", function(e){
    var v = e.target.value;
    if(e.target.checked) S.seasons.push(v);
    else S.seasons = S.seasons.filter(function(x){ return x !== v; });
    S.page = 1; clearDc(); render();
  });

  var qTimer;
  $("#q").addEventListener("input", function(){
    var v = this.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(function(){ S.q = v.trim(); S.page = 1; clearDc(); render(); }, 180);
  });

  $("#pager").addEventListener("click", function(e){
    var b = e.target.closest("button[data-p]");
    if(!b || b.disabled) return;
    S.page = +b.dataset.p;
    clearDc();
    render();
    window.scrollTo({ top:0, behavior:"smooth" });
  });

  $("#chips").addEventListener("click", function(e){
    var b = e.target.closest("[data-x]");
    if(!b) return;
    var x = b.dataset.x;
    if(x === "all") return resetFilters();
    if(x === "q"){ S.q = ""; $("#q").value = ""; }
    else if(x.indexOf("brand:") === 0){
      var bn = x.slice(6);
      S.brands = S.brands.filter(function(v){ return v !== bn; });
      $$('#brandlist input').forEach(function(i){ if(i.value === bn) i.checked = false; });
    } else if(x.indexOf("season:") === 0){
      var sn = x.slice(7);
      S.seasons = S.seasons.filter(function(v){ return v !== sn; });
      $$('#seasonlist input').forEach(function(i){ if(i.value === sn) i.checked = false; });
    }
    S.page = 1; clearDc(); render();
  });

  function resetFilters(){
    S.q = ""; S.brands = []; S.seasons = []; S.page = 1;
    clearDc();
    $("#q").value = "";
    $$('#brandlist input, #seasonlist input').forEach(function(i){ i.checked = false; });
    render();
  }
  /* ---------- 관리자 진입 (로고 마크 + 비밀번호) ---------- */
  var PW = "1234";
  var veil = $("#lockveil"), pw = $("#lockpw"), err = $("#lockerr");

  function openLock(){
    veil.hidden = false; err.hidden = true; pw.value = ""; pw.focus();
  }
  function closeLock(){ veil.hidden = true; }
  function tryEnter(){
    if(pw.value === PW){ closeLock(); go("admin"); }
    else { err.hidden = false; pw.value = ""; pw.focus(); }
  }
  $("#mk-admin").addEventListener("click", openLock);
  $("#lockok").addEventListener("click", tryEnter);
  $("#lockno").addEventListener("click", closeLock);
  pw.addEventListener("keydown", function(e){ if(e.key === "Enter") tryEnter(); });
  veil.addEventListener("click", function(e){ if(e.target === veil) closeLock(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !veil.hidden) closeLock(); });

  /* ---------- 관리자 : 제조사별 가격표 업로드 ---------- */
  var BRANDS = [
    {b:"한국",      file:"한국_공장도가_0818.xlsx",      when:"2026-08-18 09:00", days:0},
    {b:"금호",      file:"금호_공장도가_0818.xlsx",      when:"2026-08-18 09:00", days:0},
    {b:"넥센",      file:"넥센_공장도가_0817.xlsx",      when:"2026-08-17 10:20", days:1},
    {b:"미쉐린",    file:"미쉐린_8월가격표.xlsx",        when:"2026-08-14 15:40", days:4},
    {b:"콘티넨탈",  file:"콘티넨탈_8월가격표.csv",       when:"2026-08-14 15:41", days:4},
    {b:"브리지스톤",file:"브리지스톤_8월.xlsx",          when:"2026-08-11 09:30", days:7},
    {b:"피렐리",    file:"피렐리_수입가_0805.xlsx",      when:"2026-08-05 11:10", days:13},
    {b:"던롭",      file:"던롭_8월가격표.xlsx",          when:"2026-08-04 16:05", days:14},
    {b:"굿이어",    file:"굿이어_7월가격표.xlsx",        when:"2026-07-28 14:00", days:21},
    {b:"요코하마",  file:"요코하마_7월가격표.xlsx",      when:"2026-07-26 10:15", days:23}
  ];
  var HISTORY = [
    {when:"2026-08-18 09:00", b:"한국",   file:"한국_공장도가_0818.xlsx"},
    {when:"2026-08-18 09:00", b:"금호",   file:"금호_공장도가_0818.xlsx"},
    {when:"2026-08-17 10:20", b:"넥센",   file:"넥센_공장도가_0817.xlsx"},
    {when:"2026-08-14 15:41", b:"콘티넨탈", file:"콘티넨탈_8월가격표.csv"},
    {when:"2026-08-14 15:40", b:"미쉐린", file:"미쉐린_8월가격표.xlsx"}
  ];

  /* 오래 안 올린 제조사는 눈에 띄어야 한다 */
  function statusPill(d){
    if(d === 0) return '<span class="pill ok">오늘 갱신</span>';
    if(d <= 7)  return '<span class="pill new">' + d + '일 전</span>';
    return '<span class="pill low">' + d + '일 전</span>';
  }

  function renderBrands(){
    $("#bgrid").innerHTML = BRANDS.map(function(x, i){
      return '<div class="bcard" data-i="' + i + '">' +
        '<div class="bc-h"><b>' + x.b + '</b>' + statusPill(x.days) + '</div>' +
        '<div class="bc-file">' + x.file + '</div>' +
        '<div class="bc-when">' + x.when + '</div>' +
        '<div class="bdrop"><b>파일 올리기</b><span>끌어다 놓거나 클릭</span></div>' +
      '</div>';
    }).join("");
  }
  function renderHistory(){
    $("#hrows").innerHTML = HISTORY.slice(0, 8).map(function(h){
      return '<tr><td class="num">' + h.when + '</td><td style="font-weight:700">' + h.b + '</td><td>' + h.file +
             '</td><td class="t-c"><button class="btn btn-out btn-sm">되돌리기</button></td></tr>';
    }).join("");
  }
  renderBrands();
  renderHistory();

  var NOW = "2026-08-18 14:22";
  function uploadTo(i){
    var x = BRANDS[i];
    var card = $('.bcard[data-i="' + i + '"]');
    var dropBox = $(".bdrop b", card);
    dropBox.textContent = "올리는 중…";
    setTimeout(function(){
      x.file = x.b + "_공장도가_0818.xlsx";
      x.when = NOW;
      x.days = 0;
      HISTORY.unshift({ when:NOW, b:x.b, file:x.file });
      renderBrands();
      renderHistory();
      var done = $('.bcard[data-i="' + i + '"]');
      done.classList.add("done");
      $(".bdrop b", done).textContent = "올라갔습니다";
      toast(x.b + " 가격표를 새 파일로 바꿨습니다.");
    }, 700);
  }

  $("#bgrid").addEventListener("click", function(e){
    var card = e.target.closest(".bcard");
    if(card) uploadTo(+card.dataset.i);
  });
  ["dragenter", "dragover"].forEach(function(ev){
    $("#bgrid").addEventListener(ev, function(e){
      var card = e.target.closest(".bcard");
      if(!card) return;
      e.preventDefault();
      card.classList.add("over");
    });
  });
  $("#bgrid").addEventListener("dragleave", function(e){
    var card = e.target.closest(".bcard");
    if(card) card.classList.remove("over");
  });
  $("#bgrid").addEventListener("drop", function(e){
    var card = e.target.closest(".bcard");
    if(!card) return;
    e.preventDefault();
    card.classList.remove("over");
    uploadTo(+card.dataset.i);
  });

  $("#btn-tpl").addEventListener("click", function(){
    toast("업로드 양식(공장도가_양식.xlsx)을 내려받습니다.");
  });

  render();
})();
</script>
